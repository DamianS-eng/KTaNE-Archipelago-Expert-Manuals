        <style>
            body {
                background-color: #222326;
                color: #FFFFFF;
                font-family: "Special Elite";
            }
            img.responsive {
                height: 90px;
            }
            @media (max-width: 767px) {
                img.responsive {
                    height: 50px;
                }
            }

            .button {
                background-color: #BA4423;
                border-radius: 2.5em;
                font-size: 36px;
                width: 100%;
                margin-top: 5px;
                margin-bottom: 10px;
            }
            .col-md-11 {
                width: 12.499999995%;
                flex: 0 0 12.499%;
                max-width: 12.499%;
            }
            .container {
                margin: 0px;
                max-width: 100%;
            }
            .mod-icon {
                margin: auto;
                display: block;
            }
            .mod-text {
                height: 50px;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            @media (max-width: 767px) {
                .mod-text {
                    justify-content: left;
                    text-align: left;
                }
            }
            .module {
                background-color: #333334;
                color: #000000;
                margin: 3px;
                padding: 3px;
                padding-top: 6px;
            }
            .padding-correction {
                padding-right: 5px;
                padding-left: 5px;
            }
            .title-icon {
                max-height: 100px;
                margin-left: auto;
                margin-right: auto;
                width: 100%;
                object-fit: contain;
            }
            .unlocked {
                background-color: #666666 !important;
                color: #FFFFFF !important;
            }
            .username {
                font-size: 24px;
                text-align: center;
                width: 100%;
                display: block;
            }
            @media(prefers-color-scheme: dark) {
            }
        </style>
