<!DOCTYPE html>
<html lang="en-us">
    <head>
        <title>AP KTANE - Not Unlocked Modules</title>
        <meta charset="UTF-8">
        <meta name="color-scheme" content="light dark" />
      	<meta name="theme-color" media="(prefers-color-scheme: light)" content="gray" />
      	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="red" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
        <style>
            body {
                background-color: #222326;
                color: #FFFFFF;
                font-family: "Special Elite";
            }

            .center-text {
                text-align: center;
            }
            .container {
                margin: 0px;
                max-width: 100%;
            }
            .locked-sign {
                color: #FF0000;
                font-weight: 900;
                text-align: center;
                font-size: 156px;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .title-icon {
                max-height: 100px;
                margin-left: auto;
                margin-right: auto;
                width: 100%;
                object-fit: contain;
            }
            .username {
                font-size: 24px;
                text-align: center;
                width: 100%;
                display: block;
            }
            @media(prefers-color-scheme: dark) {
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-0 col-lg-2"></div>
                <div class="col-12 col-sm-6 col-lg-4 my-auto">
                    <img class="title-icon" src="https://archipelago.gg/static/static/branding/header-logo.svg" alt="AP logo">
                </div>
                <div class="col-12 col-sm-6 col-lg-4 my-auto">
                    <img class="title-icon" src="https://www.bombmanual.com/img/header.png" alt="KTANE logo">
                </div>
                <div class="col-0 col-lg-2"></div>
            </div>
            <div class="row">
                <div class="col-0 col-lg-2"></div>
                <div class="col-12 col-lg-8">
                    <span class="username"><!--{playerInfo["name"]}--></span>
                </div>
                <div class="col-0 col-lg-2"></div>
            </div>
            <div class="row">
                <div class="col-12">
                    <span class="locked-sign">🔒</span>
                </div>
            </div>
            <div class="row">
                <div class="col-12 center-text">
                    The module <!--{module}--> is not unlocked yet.
                </div>
            </div>
        </div>
    </body>
</html>
